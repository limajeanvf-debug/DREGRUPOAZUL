document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"86b576ca-3ab4-48d8-90cf-29e2382cf24b\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <style>\n    body{margin:0;background:#EEF2FA;}\n    input::placeholder{color:#B7C0D8;}\n    select{cursor:pointer;}\n    @media print{\n      [data-noprint]{display:none !important;}\n      body{background:#fff !important;}\n      *{overflow:visible !important;}\n      div[style*=\"min-width:900px\"]{min-width:0 !important;}\n    }\n  <\u002Fstyle>\n  <script src=\"69589ed7-2d07-4e41-8aa8-e22d013bc955\"><\u002Fscript>\n<\u002Fhelmet>\n\n<sc-if value=\"{{ showLogin }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"font-family:Arial,Helvetica,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;\">\n    <div style=\"width:100%;max-width:420px;\">\n      <div style=\"text-align:center;margin-bottom:22px;\">\n        <div style=\"font-size:26px;font-weight:700;color:#1D4ED8;\">DRE · Grupo Azul<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#6B7280;margin-top:4px;\">Painel financeiro — Viagens e Arranjos<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E3E8F3;border-radius:14px;box-shadow:0 1px 3px rgba(16,24,40,.06);padding:26px 28px;\">\n        <div style=\"font-size:16px;font-weight:700;color:#111827;\">Acesso<\u002Fdiv>\n        <div style=\"font-size:13px;color:#6B7280;margin-top:2px;margin-bottom:16px;\">Entre com sua conta.<\u002Fdiv>\n        <div style=\"font-size:12.5px;font-weight:600;color:#374151;margin-bottom:5px;\">E-mail<\u002Fdiv>\n        <input type=\"email\" value=\"{{ authEmail }}\" sc-camel-on-change=\"{{ onAuthEmailChange }}\" placeholder=\"voce@empresa.com.br\" style=\"width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #D8DFEE;border-radius:8px;font-size:13.5px;margin-bottom:14px;\">\n        <div style=\"font-size:12.5px;font-weight:600;color:#374151;margin-bottom:5px;\">Senha<\u002Fdiv>\n        <div style=\"position:relative;margin-bottom:6px;\">\n          <input type=\"{{ authSenhaFieldType }}\" value=\"{{ authSenha }}\" sc-camel-on-change=\"{{ onAuthSenhaChange }}\" placeholder=\"••••••••\" style=\"width:100%;box-sizing:border-box;padding:10px 40px 10px 12px;border:1px solid #D8DFEE;border-radius:8px;font-size:13.5px;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ toggleAuthSenhaVisible }}\" style=\"position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:#6B7280;font-size:12px;font-weight:600;cursor:pointer;padding:4px;\">{{ authSenhaToggleLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ authError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:12.5px;color:#DC2626;margin-bottom:8px;\">{{ authError }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ onAuthSubmit }}\" style=\"width:100%;background:#1D4ED8;color:#fff;border:none;padding:11px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;\">{{ authSubmitLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showDashboard }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"font-family:Arial,Helvetica,sans-serif;min-height:100vh;color:#111827;\">\n    <div data-noprint=\"\" style=\"background:#fff;border-bottom:1px solid #E3E8F3;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;\">\n      <div>\n        <div style=\"font-size:18px;font-weight:700;color:#1D4ED8;\">DRE · Grupo Azul<\u002Fdiv>\n        <div style=\"font-size:11.5px;color:#8A94A6;margin-top:1px;\">{{ sessionEmail }} · sem papel<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;background:#E5EAF5;border-radius:9px;padding:3px;\">\n        <button sc-camel- :pointer;\" style-hover=\"background:#FEF3F2;border-color:#FDA29B;\">Limpar lançamentos<\u002Fbutton>\n            <sc-if value=\"{{ confirmClear }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"position:absolute;top:calc(100% + 10px);right:0;z-index:40;width:290px;background:#fff;border:1px solid #E3E8F3;border-radius:12px;box-shadow:0 12px 28px rgba(16,24,40,.16);padding:14px;\">\n                <div style=\"font-size:13px;font-weight:700;color:#111827;margin-bottom:4px;\">Confirmar limpeza<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#667085;line-height:1.45;margin-bottom:12px;text-wrap:pretty;\">{{ clearConfirmLabel }} Esta ação zera todos os valores desta competência e não pode ser desfeita.<\u002Fdiv>\n                <div style=\"display:flex;gap:8px;justify-content:flex-end;\">\n                  <button sc-camel-on-click=\"{{ onCancelClear }}\" style=\"background:#fff;border:1px solid #E3E8F3;color:#374151;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;\">Cancelar<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ onConfirmClear }}\" style=\"background:#B42318;border:1px solid #B42318;color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;\">Limpar tudo<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:14px;flex-wrap:wrap;\">\n        <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n          <div style=\"flex:1;min-width:170px;box-sizing:border-box;background:#fff;border:1px solid #E3E8F3;border-radius:14px;box-shadow:0 1px 3px rgba(16,24,40,.06);padding:16px 18px;\">\n            <div style=\"display:flex;justify-content:space-between;align-items:flex-start;\">\n              <div style=\"font-size:11px;color:#6B7280;text-transform:uppercase;letter-spacing:.04em;fo \",\"Fevereiro\",\"Março\",\"Abril\",\"Maio\",\"Junho\",\"Julho\",\"Agosto\",\"Setembro\",\"Outubro\",\"Novembro\",\"Dezembro\"];\nconst YEARS = [2025,2026,2027];\nconst UNIT_DEFS = [\n{name:\"Loja Azul Viagens Shopping Recife\",tipo:\"turismo\",cor:\"#1d4ed8\"},\n{name:\"Loja Azul Viagens João Roma\",tipo:\"turismo\",cor:\"#2563eb\"},\n{name:\"Sonho Azul\",tipo:\"turismo\",cor:\"#0ea5e9\"},\n{name:\"Loja Arranjos Express Shopping Recife\",tipo:\"arranjos\",cor:\"#ec4899\"},\n{name:\"Loja Arranjos Express Conselheiro Aguiar\",tipo:\"arranjos\",cor:\"#f43f5e\"},\n];\nconst CATEGORIES = [\n{key:\"faturamento\",label:\"Faturamento\"},\n{key:\"receita\",label:\"Receita\"},\n{key:\"deducao\",label:\"Deduções da Receita\"},\n{key:\"ocupacao\",label:\"Ocupação\"},\n{key:\"pessoal\",label:\"Pessoal\"},\n{key:\"marketing\",label:\"Marketing\"},\n{key:\"outras_despesas\",label:\"Outras Despesas\"},\n{key:\"custos_extras\",label:\"Custos Extras\"},\n{key:\"passivo\",label:\"Passivo\"},\n{key:\"pro_labore\",label:\"Pró-labore\"},\n];\nconst DETAIL_ROWS = [\n{id:\"fat_pacote\",label:\"Faturamento Venda de Pacote Azul Viagens\",cat:\"faturamento\",tipo:\"turismo\"},\n{id:\"fat_aereo\",label:\"Faturamento Venda de Aéreo Azul Linhas\",cat:\"faturamento\",tipo:\"turismo\"},\n{id:\"fat_consolidadoras\",label:\"Faturamento Consolidação\",cat:\"faturamento\",tipo:\"turismo\"},\n{id:\"fat_arranjos\",label:\"Faturamento Venda de Arranjos\",cat:\"faturamento\",tipo:\"arranjos\"},\n{id:\"fat_outros\",label:\"Faturamento Outros Serviços\",cat:\"faturamento\",tipo:\"turismo\"},\n\n{id:\"rec_pacote\",label:\"Receita Venda de Pacote\",cat:\"receita\",tipo:\"turismo\"},\n{id:\"rec_aereo\",label:\"Receita Venda de Aéreo Azul Linhas\",cat:\"receita\",tipo:\"turismo\"},\n{id:\"rec_inc_av\",label:\"Incentivo Azul Viagens\",cat:\"receita\",tipo:\"turismo\"},\n{id:\"rec_inc_al\",label:\"Incentivo Azul Linhas\",cat:\"receita\",tipo:\"turismo\"},\n{id:\"rec_ancil\",label:\"Receita de Consolidação\",cat:\"receita\",tipo:\"turismo\"},\n{id:\"rec_inc_ac\",label:\"Incentivo Ação Comercial\",cat:\"receita\",tipo:\"turismo\"},\n{id:\"rec_outros\",label:\"Receita Outros\",cat:\"receita\",tipo:\"turismo\"},\n{id:\"rec_markup\",label:\"Mark-up\",cat:\"receita\",tipo:\"turismo\"},\n{id:\"rec_arranjos\",label:\"Receita Venda de Arranjos\",cat:\"receita\",tipo:\"arranjos\"},\n\n{id:\"ded_imp\",label:\"Imposto sobre as Vendas\",cat:\"deducao\"},\n{id:\"ocu_aluguel\",label:\"Aluguel\",cat:\"ocupacao\"},\n{id:\"ocu_cond\",label:\"Condomínio\",cat:\"ocupacao\"},\n{id:\"ocu_fundo\",label:\"Fundo de Propaganda\",cat:\"ocupacao\"},\n{id:\"ocu_iptu\",label:\"IPTU\",cat:\"ocupacao\"},\n{id:\"ocu_ar\",label:\"Ar Condicionado\",cat:\"ocupacao\"},\n{id:\"ocu_taxa\",label:\"Taxa de Administração\",cat:\"ocupacao\"},\n{id:\"ocu_manut\",label:\"Manutenção / Limpeza\",cat:\"ocupacao\"},\n{id:\"ocu_energia\",label:\"Energia Elétrica\",cat:\"ocupacao\"},\n{id:\"ocu_agua\",label:\"Água\",cat:\"ocupacao\"},\n{id:\"ocu_telefone\",label:\"Telefone\",cat:\"ocupacao\"},\n{id:\"ocu_seguro\",label:\"Seguro\",cat:\"ocupacao\"},\n{id:\"ocu_outras\",label:\"Outras Despesas de Ocupação\",cat:\"ocupacao\"},\n{id:\"pes_sal\",label:\"Salários Funcionários\",cat:\"pessoal\"},\n{id:\"pes_comis\",label:\"Comissão Funcionários\",cat:\"pessoal\"},\n{id:\"pes_dsr\",label:\"DSR\",cat:\"pessoal\"},\n{id:\"pes_enc\",label:\"Encargos\",cat:\"pessoal\"},\n{id:\"pes_ferias\",label:\"Provisão Férias\",cat:\"pessoal\"},\n{id:\"pes_13\",label:\"Provisão 13º Salário\",cat:\"pessoal\"},\n{id:\"pes_exames\",label:\"Exames\",cat:\"pessoal\"},\n{id:\"pes_bonus\",label:\"Bônus e Premiação\",cat:\"pessoal\"},\n{id:\"pes_vr\",label:\"Benefícios - Vale Refeição\",cat:\"pessoal\"},\n{id:\"pes_vt\",label:\"Benefícios - Vale Transporte\",cat:\"pessoal\"},\n{id:\"pes_saude\",label:\"Benefícios - Plano de Saúde\",cat:\"pessoal\"},\n{id:\"pes_outros\",label:\"Benefícios - Outros\",cat:\"pessoal\"},\n{id:\"pes_estag\",label:\"Estagiários\",cat:\"pessoal\"},\n{id:\"pes_diarias\",label:\"Diárias\",cat:\"pessoal\",tipo:\"arranjos\"},\n{id:\"mkt_anuncios\",label:\"Custos com Anúncios\",cat:\"marketing\"},\n{id:\"mkt_influenciadores\",label:\"Custos com Influenciadores\",cat:\"marketing\"},\n{id:\"mkt_brindes\",label:\"Custos com Brindes\",cat:\"marketing\"},\n{id:\"out_tarifa\",label:\"Tarifa\",cat:\"outras_despesas\"},\n{id:\"out_consorcios\",label:\"Consórcios\",cat:\"outras_despesas\"},\n{id:\"out_seguros\",label:\"Seguros\",cat:\"outras_despesas\"},\n{id:\"out_sistema\",label:\"Sistema (Google / CRM)\",cat:\"outras_despesas\"},\n{id:\"out_wintour\",label:\"Sistema Wintour\",cat:\"outras_despesas\"},\n{id:\"out_wts\",label:\"Sistema WTS\",cat:\"outras_despesas\"},\n{id:\"out_uniforme\",label:\"Uniforme\",cat:\"outras_despesas\"},\n{id:\"out_viagens\",label:\"Viagens (Reuniões / Famtours)\",cat:\"outras_despesas\"},\n{id:\"out_ti\",label:\"Terceirizados - TI\",cat:\"outras_despesas\"},\n{id:\"out_contador\",label:\"Terceirizados - Contador\",cat:\"outras_despesas\"},\n{id:\"out_limpeza\",label:\"Terceirizados - Limpeza\",cat:\"outras_despesas\"},\n{id:\"out_portador\",label:\"Terceirizados - Portador\",cat:\"outras_despesas\"},\n{id:\"out_juridico\",label:\"Terceirizados - Assessoria Jurídica\",cat:\"outras_despesas\"},\n{id:\"out_outros\",label:\"Terceirizados - Outros\",cat:\"outras_despesas\"},\n{id:\"cex_rescisao\",label:\"Rescisão de Funcionário\",cat:\"custos_extras\"},\n{id:\"cex_outros\",label:\"Outros Extras\",cat:\"custos_extras\"},\n{id:\"cex_indeniz\",label:\"Ações Indenizatórias\",cat:\"custos_extras\"},\n{id:\"pas_emprestimos\",label:\"Empréstimos\",cat:\"passivo\"},\n{id:\"pas_financiamentos\",label:\"Financiamentos\",cat:\"passivo\"},\n{id:\"pas_cartoes\",label:\"Cartões\",cat:\"passivo\"},\n{id:\"prl_joao\",label:\"João Almeida\",cat:\"pro_labore\"},\n{id:\"prl_carlos\",label:\"Carlos Henrique\",cat:\"pro_labore\"},\n];\nconst SUMMARY_ROWS = [\n{key:\"faturamento\",label:\"Faturamento\",kind:\"plain\"},\n{key:\"receitaBruta\",label:\"Receita bruta\",kind:\"plain\"},\n{key:\"deducoes\",label:\"(-) Deduções\",kind:\"plain\"},\n{key:\"receita\",label:\"(=) Receita\",kind:\"sub\"},\n{key:\"ocupacao\",label:\"(-) Ocupação\",kind:\"expense\"},\n{key:\"pessoal\",label:\"(-) Pessoal\",kind:\"expense\"},\n{key:\"marketing\",label:\"(-) Marketing\",kind:\"expense\"},\n{key:\"outras\",label:\"(-) Outras despesas\",kind:\"expense\"},\n{key:\"custosExtras\",label:\"(-) Custos extras\",kind:\"expense\"},\n{key:\"despesas\",label:\"(=) Despesas\",kind:\"subExpense\"},\n{key:\"lucroOperacional\",label:\"(=) Lucro operacional\",kind:\"final\"},\n{key:\"passivo\",label:\"(-) Passivo\",kind:\"expense\"},\n{key:\"proLabore\",label:\"(-) Pró-labore\",kind:\"expense\"},\n{key:\"lucroFinal\",label:\"(=) Lucro final\",kind:\"final\"},\n{key:\"margem\",label:\"Margem (%)\",kind:\"pct\"},\n];\nconst LS_USERS = \"dreAzul_users_v1\", LS_SESSION = \"dreAzul_session_v1\", LS_DATA = \"dreAzul_data_v1\", LS_DEBTS = \"dreAzul_debts_v1\", LS_AUDIT = \"dreAzul_audit_v1\", LS_LOCKS = \"dreAzul_locks_v1\", LS_TOKEN = \"dreAzul_token_v1\";\n// Aponte para o backend publicado para sair do modo offline (localStorage) e falar com a API real.\nconst API_BASE_URL = \"https://dregrupoazul.onrender.com\"; // schema aplicado\nasync function apiFetch(path, opts){\n  const token = localStorage.getItem(LS_TOKEN);\n  const headers = {\"Content-Type\":\"application/json\", ...((opts&&opts.headers)||{})};\n  if(token) headers.Authorization = \"Bearer \"+token;\n  const res = await fetch(API_BASE_URL+path, {...opts, headers});\n  if(res.status===401){\n    // Sessão expirada/inválida. Antes o 401 era engolido em silêncio: a tela\n    // seguia mostrando o localStorage, nada subia nem descia, e o usuário\n    // achava que estava sincronizado.\n    localStorage.removeItem(LS_TOKEN);\n    localStorage.removeItem(LS_SESSION);\n    window.dispatchEvent(new Event(\"dre-sessao-expirada\"));\n    throw new Error(\"api_401\");\n  }\n  if(!res.ok) throw new Error(\"api_\"+res.status);\n  const ct = res.headers.get(\"content-type\")||\"\";\n  return ct.includes(\"application/json\") ? res.json() : null;\n}\n\nfunction getPeriodCredores(unit, year, month){\n  const byPeriod = unit.customRows && unit.customRows.passivoByPeriod;\n  return (byPeriod && byPeriod[`${year}-${month}`]) || [];\n}\nfunction getVal(unit, rowId, year, month){\n  const y = unit.values[rowId];\n  return y ? (y[`${year}-${month}`] ?? 0) : 0;\n}\nfunction computeDebtAccumulated(debt, year, month){\n  let months = (year-debt.anoInicial)*12 + (month-debt.mesInicial);\n  if(months<0) months=0;\n  return debt.valorInicial * (1 + (debt.jurosMensal/100)*months);\n}\nfunction debtMonthlyInterest(debt, year, month){\n  let months = (year-debt.anoInicial)*12 + (month-debt.mesInicial);\n  if(months<0) return 0;\n  return debt.valorInicial * (debt.jurosMensal/100);\n}\nfunction totalDebts(debts, year, month){\n  return debts.reduce((s,d)=>s+computeDebtAccumulated(d,year,month), 0);\n}\nfunction catSum(cat, unit, year, month){\n  let s = 0;\n  for(const r of DETAIL_ROWS) if(r.cat===cat && (!r.tipo || r.tipo===unit.tipo)) s += getVal(unit,r.id,year,month);\n  if(cat===\"passivo\") for(const cr of getPeriodCredores(unit,year,month)) s += getVal(unit,cr.id,year,month);\n  return s;\n}\nfunction computeUnitMonth(unit, year, month){\n  const faturamento = catSum(\"faturamento\",unit,year,month);\n  const receitaBruta = catSum(\"receita\",unit,year,month);\n  const deducoes = catSum(\"deducao\",unit,year,month);\n  const receita = receitaBruta - deducoes;\n  const ocupacao = catSum(\"ocupacao\",unit,year,month);\n  const pessoal = catSum(\"pessoal\",unit,year,month);\n  const marketing = catSum(\"marketing\",unit,year,month);\n  const outras = catSum(\"outras_despesas\",unit,year,month);\n  const custosExtras = catSum(\"custos_extras\",unit,year,month);\n  const despesas = ocupacao+pessoal+marketing+outras+custosExtras;\n  const lucroOperacional = receita-despesas;\n  const passivo = catSum(\"passivo\",unit,year,month);\n  const proLabore = catSum(\"pro_labore\",unit,year,month);\n  const lucroFinal = lucroOperacional-passivo-proLabore;\n  const margem = faturamento ? lucroFinal/faturamento : 0;\n  return {faturamento,receitaBruta,deducoes,receita,ocupacao,pessoal,marketing,outras,custosExtras,despesas,lucroOperacional,passivo,proLabore,lucroFinal,margem};\n}\nfunction sumResults(list){\n  const keys = [\"faturamento\",\"receitaBruta\",\"deducoes\",\"receita\",\"ocupacao\",\"pessoal\",\"marketing\",\"outras\",\"custosExtras\",\"despesas\",\"lucroOperacional\",\"passivo\",\"proLabore\",\"lucroFinal\"];\n  const g = {};\n  for(const k of keys) g[k] = list.reduce((s,r)=>s+r[k],0);\n  g.margem = g.faturamento ? g.lucroFinal/g.faturamento : 0;\n  return g;\n}\nfunction formatBRL(v){\n  const r = Math.round(v);\n  if(r===0) return \"R$ 0,00\";\n  const abs = Math.abs(v).toLocaleString(\"pt-BR\",{minimumFractionDigits:2,maximumFractionDigits:2});\n  return r<0 ? `-R$ ${abs}` : `R$ ${abs}`;\n}\nfunction formatPct(v){ return (v*100).toLocaleString(\"pt-BR\",{minimumFractionDigits:1,maximumFractionDigits:1})+\"%\"; }\nfunction formatBRLOrDash(v){ return Math.round(v)===0 ? \"—\" : formatBRL(v); }\nfunction formatMoeda(v){\n  const abs = Math.abs(v).toLocaleString(\"pt-BR\",{minimumFractionDigits:2,maximumFractionDigits:2});\n  return v<0 ? `(R$ ${abs})` : `R$ ${abs}`;\n}\nfunction parseMoedaInput(str){\n  const digits = str.replace(/\\D/g,\"\");\n  return digits ? parseInt(digits,10)/100 : 0;\n}\nfunction cumulativeLucro(unit, year, month){\n  let total = 0;\n  for(const y of YEARS){\n    if(y>year) continue;\n    const maxM = y===year ? month : 11;\n    for(let m=0; m<=maxM; m++) total += computeUnitMonth(unit,y,m).lucroFinal;\n  }\n  return total;\n}\n\nclass Component extends DCLogic {\n  state = {\n    session: null,\n    authMode: \"entrar\",\n    authEmail: \"\", authSenha: \"\", authError: \"\",\n    users: [{email:\"adm@azulviagensrec.com.br\", senha:\"96313315Je\", role:\"admin\"}],\n    showAuthSenha: false,\n    view: \"operacao\",\n    opIndex: 0,\n    month: 6,\n    year: 2026,\n    units: UNIT_DEFS.map(u=>({name:u.name, tipo:u.tipo, cor:u.cor, values:{}, capitalSocial:0, customRows:{}})),\n    newCredorLabel: \"\",\n    confirmClear: false,\n    debts: [], auditLog: [], locks: {},\n    newDebtCredor: \"\", newDebtValorRaw: 0, newDebtMes: 6, newDebtAno: 2026, newDebtJuros: 0,\n    adminOpen: false,\n    newUserEmail:\"\", newUserSenha:\"\", newUserRole:\"usuario\",\n    changeUserEmail:\"\", changeUserSenha:\"\", adminMsg:\"\",\n    exportMonth: 6, exportYear: 2026, exportScope: \"consolidado\", exportLoja: \"todas\",\n    opIdByName: {}, catIdByCode: {}, catCodeById: {}, opNameById: {},\n  };\n\n  componentDidMount(){\n    try{\n      const rawUsers = localStorage.getItem(LS_USERS);\n      const users = rawUsers ? JSON.parse(rawUsers) : this.state.users;\n      if(!rawUsers) localStorage.setItem(LS_USERS, JSON.stringify(users));\n      const rawSession = localStorage.getItem(LS_SESSION);\n      const session = rawSession ? JSON.parse(rawSession) : null;\n      const rawData = localStorage.getItem(LS_DATA);\n      let units = this.state.units;\n      if(rawData){\n        const data = JSON.parse(rawData);\n        units = this.state.units.map(u=>{\n          const d = data[u.name];\n          if(!d) return u;\n          return d.values ? {...u, values:d.values, capitalSocial:d.capitalSocial||0, customRows:d.customRows||{}} : {...u, values:d};\n        });\n      }\n      const rawDebts = localStorage.getItem(LS_DEBTS);\n      const debts = rawDebts ? JSON.parse(rawDebts) : [];\n      const rawAudit = localStorage.getItem(LS_AUDIT);\n      const auditLog = rawAudit ? JSON.parse(rawAudit) : [];\n      const rawLocks = localStorage.getItem(LS_LOCKS);\n      const locks = rawLocks ? JSON.parse(rawLocks) : {};\n      this.setState({users, session, units, debts, auditLog, locks, changeUserEmail: users[0] ? users[0].email : \"\"});\n    }catch(e){}\n    this._storageHandler = (e)=>{\n      if(e.key===LS_LOCKS){ try{ this.setState({locks: e.newValue?JSON.parse(e.newValue):{}}); }catch(err){} }\n    };\n    window.addEventListener(\"storage\", this._storageHandler);\n    this._lockCleanup = setInterval(()=>{\n      const locks = this.state.locks; const now=Date.now(); let changed=false;\n      const next = {};\n      for(const k in locks){ if(now-locks[k].ts < 8000){ next[k]=locks[k]; } else changed=true; }\n      if(changed) this.setState({locks:next});\n    }, 4000);\n    if(API_BASE_URL){\n      this.loadFromApi();\n      this._apiLockPoll = setInterval(()=>{\n        if(!this.state.session) return;\n        apiFetch(\"/api/locks\").then(rows=>{\n          const remote = {};\n          rows.forEach(r=>{\n            const [opIdStr, rest] = r.campo_key.split(\":\");\n            const name = this.state.opNameById[opIdStr];\n            const code = this.state.catCodeById[rest] || rest;\n            if(name) remote[`${name}:${code}`] = {user:r.email, ts:Date.now()};\n          });\n          this.setState(s=>({locks:{...s.locks, ...remote}}));\n        }).catch(()=>{});\n      }, 3000);\n      this._apiDataPoll = setInterval(()=>{\n        if(!this.state.session) return;\n        if(this.activeEditKeys().length) return;\n        // campo focado só congela a sincronização por 8s após a última digitação\n        if(this._editingField && this._lastEditTs && Date.now()-this._lastEditTs < 8000) return;\n        this.loadFromApi();\n      }, 4000);\n      this._sessaoExpiradaHandler = ()=>{\n        if(!this.state.session) return;\n        this.setState({session:null, authError:\"Sua sessão expirou. Entre novamente para voltar a sincronizar.\"});\n      };\n      window.addEventListener(\"dre-sessao-expirada\", this._sessaoExpiradaHandler);\n      this._focusHandler = ()=>{ if(this.state.session && !this.activeEditKeys().length) this.loadFromApi(); };\n      window.addEventListener(\"focus\", this._focusHandler);\n      document.addEventListener(\"visibilitychange\", this._focusHandler);\n      // última rede de segurança: descarrega o que ainda não foi enviado\n      this._flushHandler = ()=>this.flushCommits();\n      window.addEventListener(\"pagehide\", this._flushHandler);\n      window.addEventListener(\"beforeunload\", this._flushHandler);\n    }\n  }\n  componentWillUnmount(){\n    if(this._sessaoExpiradaHandler) window.removeEventListener(\"dre-sessao-expirada\", this._sessaoExpiradaHandler);\n    this.flushCommits();\n    if(this._flushHandler){ window.removeEventListener(\"pagehide\", this._flushHandler); window.removeEventListener(\"beforeunload\", this._flushHandler); }\n    if(this._apiDataPoll) clearInterval(this._apiDataPoll);\n    if(this._focusHandler){ window.removeEventListener(\"focus\", this._focusHandler); document.removeEventListener(\"visibilitychange\", this._focusHandler); }\n    if(this._storageHandler) window.removeEventListener(\"storage\", this._storageHandler);\n    if(this._lockCleanup) clearInterval(this._lockCleanup);\n    if(this._apiLockPoll) clearInterval(this._apiLockPoll);\n  }\n  // true se a linha foi digitada nos últimos 8s. Antes _editingRow só era\n  // limpado no blur — trocar de mês/aba deixava a linha \"em edição\" para\n  // sempre e ela nunca mais recebia o valor do servidor.\n  editandoAgora(bufKey){\n    return this._editingRow === bufKey && this._lastEditTs && Date.now()-this._lastEditTs < 8000;\n  }\n  async loadFromApi(){\n    const token = localStorage.getItem(LS_TOKEN);\n    if(!token) return;\n    if(this._loadingApi) return;   // evita polls sobrepostos\n    this._loadingApi = true;\n    try{\n      const [ops, cats] = await Promise.all([apiFetch(\"/api/operacoes\"), apiFetch(\"/api/categorias\")]);\n      const opIdByName={}, opNameById={}, catIdByCode={}, catCodeById={};\n      ops.forEach(o=>{ opIdByName[o.nome]=o.id; opNameById[o.id]=o.nome; });\n      cats.forEach(c=>{ catIdByCode[c.codigo]=c.id; catCodeById[c.id]=c.codigo; });\n      // Tudo em paralelo. Em série (unidades × anos) um ciclo passava dos 4s do\n      // intervalo, os polls se acumulavam e a sincronização parava de entregar.\n      const baseUnits = this.state.units;\n      const fetched = await Promise.all(baseUnits.map(async u=>{\n        const op = ops.find(o=>o.nome===u.name);\n        const opId = op ? op.id : null;\n        if(!opId) return {op:null, opId:null, credores:[], porAno:[]};\n        const [credores, ...porAno] = await Promise.all([\n          apiFetch(`/api/operacoes/${opId}/credores`),\n          ...YEARS.map(year=>apiFetch(`/api/lancamentos?operacaoId=${opId}&ano=${year}`).then(rows=>({year, rows})))\n        ]);\n        return {op, opId, credores, porAno};\n      }));\n      // O servidor é a fonte da verdade: reconstrói do zero em vez de mesclar\n      // sobre o estado local, senão o valor antigo de cada usuário nunca sai da tela.\n      // Preserva localmente as linhas que o servidor ainda não conhece\n      // (categoria sem id no banco), senão o valor digitado é apagado.\n      const units = baseUnits.map((u, idxAtual)=>{\n        const {op, opId, credores, porAno} = fetched[idxAtual];\n        let customRows = u.customRows||{};\n        let values = {};\n        if(!opId){ values = {...u.values}; }\n        else {\n          Object.keys(u.values||{}).forEach(rowId=>{\n            const conhecida = catIdByCode[rowId]!=null\n              || (rowId.indexOf(\"credor_\")===0 && /^\\d+$/.test(rowId.replace(\"credor_\",\"\")));\n            if(!conhecida || this.editandoAgora(`${idxAtual}:${rowId}`)) values[rowId] = u.values[rowId];\n          });\n          const passivoByPeriod = {};\n          credores.forEach(c=>{\n            const key = `${c.ano}-${c.mes-1}`;\n            (passivoByPeriod[key] = passivoByPeriod[key]||[]).push({id:\"credor_\"+c.id, label:c.nome});\n          });\n          customRows = {...customRows, passivoByPeriod};\n          porAno.forEach(({year, rows})=>rows.forEach(l=>{\n            const code = l.categoria_id!=null ? catCodeById[l.categoria_id] : (\"credor_\"+l.credor_manual_id);\n            if(!code) return;\n            values[code] = {...values[code], [`${year}-${l.mes-1}`]: parseFloat(l.valor)};\n          }));\n        }\n        return {...u, capitalSocial: op ? parseFloat(op.capital_social)||0 : (u.capitalSocial||0), customRows, values};\n      });\n      const [debts, locksRows] = await Promise.all([apiFetch(\"/api/dividas\"), apiFetch(\"/api/locks\")]);\n      const mappedDebts = debts.map(d=>({id:\"debt_\"+d.id, credor:d.credor, valorInicial:parseFloat(d.valor_inicial), anoInicial:d.ano_inicial, mesInicial:d.mes_inicial-1, jurosMensal:parseFloat(d.juros_mensal)}));\n      const locks = {};\n      locksRows.forEach(r=>{\n        const [opIdStr, rest] = r.campo_key.split(\":\");\n        const name = opNameById[opIdStr];\n        const code = catCodeById[rest] || rest;\n        if(name) locks[`${name}:${code}`] = {user:r.email, ts:Date.now()};\n      });\n      const editingKeys = this.activeEditKeys();\n      if(editingKeys.length){\n        units.forEach((u,idx)=>{\n          const prev = this.state.units[idx];\n          if(!prev) return;\n          editingKeys.forEach(k=>{\n            const [ui, rowId] = k.split(\":\");\n            if(String(idx)===ui && prev.values[rowId]) u.values[rowId] = prev.values[rowId];\n          });\n        });\n      }\n      this.setState({units, debts:mappedDebts, locks, opIdByName, catIdByCode, catCodeById, opNameById});\n      if(this.state.session && this.state.session.role===\"admin\") this.refreshAdminData();\n    }catch(e){ console.error(\"Falha ao sincronizar com a API:\", e); }\n    finally{ this._loadingApi = false; }\n  }\n  refreshAdminData(){\n    if(!API_BASE_URL) return;\n    Promise.all([apiFetch(\"/api/usuarios\"), apiFetch(\"/api/auditoria\")]).then(([users,audit])=>{\n      this.setState({\n        users: users.map(u=>({email:u.email, role:u.role, remoteId:u.id, senha:\"\"})),\n        auditLog: audit.map(a=>({ts:new Date(a.criado_em).getTime(), user:a.email||\"—\", action:a.acao, detail:a.detalhe})),\n      });\n    }).catch(()=>{});\n  }\n  persistUsers(users){ localStorage.setItem(LS_USERS, JSON.stringify(users)); }\n  persistSession(session){ if(session) localStorage.setItem(LS_SESSION, JSON.stringify(session)); else localStorage.removeItem(LS_SESSION); }\n  persistData(units){ const data={}; units.forEach(u=>data[u.name]={values:u.values, capitalSocial:u.capitalSocial||0, customRows:u.customRows||{}}); localStorage.setItem(LS_DATA, JSON.stringify(data)); }\n  persistDebts(debts){ localStorage.setItem(LS_DEBTS, JSON.stringify(debts)); }\n  logAudit(action, detail){\n    const entry = {ts:Date.now(), user:(this.state.session&&this.state.session.email)||\"—\", action, detail};\n    const auditLog = [entry, ...this.state.auditLog].slice(0,200);\n    this.setState({auditLog});\n    localStorage.setItem(LS_AUDIT, JSON.stringify(auditLog));\n  }\n  campoKeyFor(key){\n    const [name,id] = key.split(\":\");\n    const opId = this.state.opIdByName[name]; const catId = this.state.catIdByCode[id];\n    if(opId==null) return null;\n    return `${opId}:${catId!=null?catId:id}`;\n  }\n  lockField(key){\n    const locks = {...this.state.locks, [key]:{user:this.state.session.email, ts:Date.now()}};\n    this.setState({locks}); localStorage.setItem(LS_LOCKS, JSON.stringify(locks));\n    if(API_BASE_URL){ const ck=this.campoKeyFor(key); if(ck) apiFetch(`/api/locks/${encodeURIComponent(ck)}`,{method:\"POST\"}).catch(()=>{}); }\n  }\n  unlockField(key){\n    const locks = {...this.state.locks}; delete locks[key];\n    this.setState({locks}); localStorage.setItem(LS_LOCKS, JSON.stringify(locks));\n    if(API_BASE_URL){ const ck=this.campoKeyFor(key); if(ck) apiFetch(`/api/locks/${encodeURIComponent(ck)}`,{method:\"DELETE\"}).catch(()=>{}); }\n  }\n\n  setAuthMode(mode){ this.setState({authMode:mode, authError:\"\"}); }\n  submitAuth(){\n    const email = this.state.authEmail.trim().toLowerCase();\n    const senha = this.state.authSenha;\n    if(!email || !senha){ this.setState({authError:\"Preencha e-mail e senha.\"}); return; }\n    if(API_BASE_URL){\n      const path = this.state.authMode===\"entrar\" ? \"/api/auth/login\" : \"/api/auth/register\";\n      const body = this.state.authMode===\"entrar\" ? {email,senha} : {email:this.state.authEmail.trim(),senha};\n      apiFetch(path,{method:\"POST\", body:JSON.stringify(body)}).then(data=>{\n        localStorage.setItem(LS_TOKEN, data.token);\n        const session = {email:data.user.email, role:data.user.role};\n        this.setState({session, authError:\"\"});\n        this.persistSession(session);\n        this.loadFromApi();\n      }).catch(()=>{\n        this.setState({authError: this.state.authMode===\"entrar\" ? \"E-mail ou senha inválidos.\" : \"Não foi possível criar a conta.\"});\n      });\n      return;\n    }\n    if(this.state.authMode===\"entrar\"){\n      const u = this.state.users.find(x=>x.email.toLowerCase()===email && x.senha===senha);\n      if(!u){ this.setState({authError:\"E-mail ou senha inválidos.\"}); return; }\n      const session = {email:u.email, role:u.role};\n      this.setState({session, authError:\"\"}); this.persistSession(session);\n    } else {\n      if(this.state.users.some(x=>x.email.toLowerCase()===email)){ this.setState({authError:\"E-mail já cadastrado.\"}); return; }\n      const users=[...this.state.users, {email:this.state.authEmail.trim(), senha, role:\"usuario\"}];\n      const session = {email:this.state.authEmail.trim(), role:\"usuario\"};\n      this.setState({users, session, authError:\"\"}); this.persistUsers(users); this.persistSession(session);\n    }\n  }\n  logout(){ this.setState({session:null}); this.persistSession(null); localStorage.removeItem(LS_TOKEN); }\n\n  changeUserRole(u, role){\n    const apply = ()=>{\n      const users = this.state.users.map(x=>x.email===u.email?{...x, role}:x);\n      this.setState({users, adminMsg:\"Papel atualizado.\"});\n      this.persistUsers(users);\n      this.logAudit(\"Alterou papel\", `${u.email} → ${role}`);\n    };\n    if(API_BASE_URL && u.remoteId){\n      apiFetch(`/api/usuarios/${u.remoteId}/role`,{method:\"PATCH\", body:JSON.stringify({role})}).then(apply)\n        .catch(()=>this.setState({adminMsg:\"Falha ao atualizar papel na API.\"}));\n      return;\n    }\n    apply();\n  }\n\n  createUser(){\n    const email = this.state.newUserEmail.trim();\n    if(!email || !this.state.newUserSenha){ return; }\n    if(this.state.users.some(u=>u.email.toLowerCase()===email.toLowerCase())){ this.setState({adminMsg:\"E-mail já existe.\"}); return; }\n    const role = this.state.newUserRole, senha = this.state.newUserSenha;\n    const apply = ()=>{\n      const users=[...this.state.users,{email,senha,role}];\n      this.setState({users,newUserEmail:\"\",newUserSenha:\"\",adminMsg:\"Usuário criado.\"});\n      this.persistUsers(users);\n      this.logAudit(\"Criou usuário\", `${email} (${role})`);\n    };\n    if(API_BASE_URL){\n      apiFetch(\"/api/usuarios\",{method:\"POST\", body:JSON.stringify({email,senha,role})}).then(apply)\n        .catch(()=>this.setState({adminMsg:\"Falha ao criar usuário na API.\"}));\n      return;\n    }\n    apply();\n  }\n  changePassword(){\n    if(!this.state.changeUserEmail || !this.state.changeUserSenha) return;\n    const email = this.state.changeUserEmail, senha = this.state.changeUserSenha;\n    const apply = ()=>{\n      const users = this.state.users.map(u=>u.email===email ? {...u,senha} : u);\n      this.setState({users, changeUserSenha:\"\", adminMsg:\"Senha atualizada.\"});\n      this.persistUsers(users);\n      this.logAudit(\"Alterou senha\", email);\n    };\n    if(API_BASE_URL){\n      const u = this.state.users.find(x=>x.email===email);\n      if(u && u.remoteId){\n        apiFetch(`/api/usuarios/${u.remoteId}/senha`,{method:\"PATCH\", body:JSON.stringify({senha})}).then(apply)\n          .catch(()=>this.setState({adminMsg:\"Falha ao atualizar senha na API.\"}));\n        return;\n      }\n    }\n    apply();\n  }\n\n  updateValue(unitIdx, rowId, strVal){\n    const v = parseMoedaInput(strVal);\n    const unit = this.state.units[unitIdx];\n    this.setState(s=>{\n      const units=[...s.units]; const u={...units[unitIdx]}; const values={...u.values};\n      values[rowId] = {...values[rowId], [`${s.year}-${s.month}`]: v};\n      u.values=values; units[unitIdx]=u;\n      this.persistData(units);\n      return {units};\n    }, ()=>this.agendarCommit(unitIdx, rowId));\n    this.logAudit(\"Editou valor\", `${unit.name} · ${rowId} · ${MESES[this.state.month]}/${this.state.year} → ${formatBRL(v)}`);\n  }\n  // Envia ao servidor pouco depois da última tecla. Antes o commit só acontecia\n  // no onBlur: quem digitava e trocava de mês/aba (ou fechava a página) salvava\n  // apenas no localStorage do próprio navegador e o valor nunca chegava ao banco.\n  agendarCommit(unitIdx, rowId){\n    if(!this._commitTimers) this._commitTimers = {};\n    const k = `${unitIdx}:${rowId}`;\n    clearTimeout(this._commitTimers[k]);\n    this._commitTimers[k] = setTimeout(()=>{\n      delete this._commitTimers[k];\n      this.commitValue(unitIdx, rowId);\n    }, 900);\n  }\n  flushCommits(){\n    if(!this._commitTimers) return;\n    Object.keys(this._commitTimers).forEach(k=>{\n      clearTimeout(this._commitTimers[k]);\n      delete this._commitTimers[k];\n      const i = k.indexOf(\":\");\n      this.commitValue(parseInt(k.slice(0,i),10), k.slice(i+1));\n    });\n  }\n  handleMoneyKeyDown(unitIdx, rowId, e){\n    if(e.ctrlKey || e.metaKey) return;\n    if(e.key===\"Enter\"){ this.flushCommits(); return; }\n    const allowed = [\"Tab\",\"Shift\",\"Control\",\"Alt\",\"Meta\",\"Enter\",\"Escape\",\"ArrowLeft\",\"ArrowRight\",\"ArrowUp\",\"ArrowDown\",\"Home\",\"End\"];\n    if(allowed.indexOf(e.key)!==-1) return;\n    e.preventDefault();\n    if(!/^[0-9]$/.test(e.key) && e.key!==\"Backspace\" && e.key!==\"Delete\") return;\n    const isDigit = /^[0-9]$/.test(e.key);\n    const bufKey = `${unitIdx}:${rowId}`;\n    if(!this._editBuffer) this._editBuffer = {};\n    if(this._editBuffer[bufKey]==null){\n      const unit0 = this.state.units[unitIdx];\n      this._editBuffer[bufKey] = Math.round(getVal(unit0, rowId, this.state.year, this.state.month)*100);\n    }\n    const cur = this._editBuffer[bufKey];\n    let next = cur;\n    if(isDigit){ next = cur*10 + parseInt(e.key,10); if(next > 999999999999) next = cur; }\n    else { next = Math.floor(cur/10); }\n    this._editBuffer[bufKey] = next;\n    if(!this._editBufferTs) this._editBufferTs = {};\n    this._editBufferTs[bufKey] = Date.now();\n    this._lastEditTs = Date.now();\n    this._editingRow = bufKey;\n    const v = next/100;\n    let unit;\n    this.setState(s=>{\n      const units=[...s.units]; const u={...units[unitIdx]}; const values={...u.values};\n      values[rowId] = {...values[rowId], [`${s.year}-${s.month}`]: v};\n      u.values = values; units[unitIdx] = u; unit = u;\n      this.persistData(units);\n      return {units};\n    }, ()=>{\n      this.agendarCommit(unitIdx, rowId);\n      this.logAudit(\"Editou valor\", `${unit.name} · ${rowId} · ${MESES[this.state.month]}/${this.state.year} → ${formatBRL(v)}`);\n    });\n  }\n  commitValue(unitIdx, rowId){\n    if(!API_BASE_URL) return;\n    const unit = this.state.units[unitIdx];\n    const v = getVal(unit, rowId, this.state.year, this.state.month);\n    const opId = this.state.opIdByName[unit.name];\n    const catId = this.state.catIdByCode[rowId];\n    const isCredor = rowId.indexOf(\"credor_\")===0 && /^\\d+$/.test(rowId.replace(\"credor_\",\"\"));\n    if(opId && (catId!=null || isCredor)){\n      apiFetch(\"/api/lancamentos\", {method:\"PUT\", body:JSON.stringify({\n        operacaoId:opId, categoriaId: catId!=null?catId:null,\n        credorManualId: isCredor ? parseInt(rowId.replace(\"credor_\",\"\"),10) : null,\n        mes:this.state.month+1, ano:this.state.year, valor:v,\n      })}).then(()=>this.loadFromApi()).catch(()=>{});\n    } else if(opId && catId==null && !isCredor){\n      // linha sem categoria no banco: mantém o valor local e avisa no console\n      console.warn(\"Categoria ausente no banco, valor mantido apenas localmente:\", rowId);\n    } else {\n      this.loadFromApi();\n    }\n  }\n  clearLancamentos(){\n    const s = this.state;\n    const unitIdx = s.opIndex;\n    const unit = s.units[unitIdx];\n    const key = `${s.year}-${s.month}`;\n    const cleared = Object.keys(unit.values||{}).filter(rowId=>{\n      const y = unit.values[rowId];\n      return y && y[key] !== undefined && y[key] !== 0;\n    });\n    this.setState(st=>{\n      const units=[...st.units]; const u={...units[unitIdx]}; const values={...u.values};\n      cleared.forEach(rowId=>{ values[rowId] = {...values[rowId], [key]: 0}; });\n      u.values=values; units[unitIdx]=u;\n      this.persistData(units);\n      return {units, confirmClear:false};\n    }, ()=>{\n      this._editBuffer = {};\n      cleared.forEach(rowId=>this.commitValue(unitIdx, rowId));\n      this.logAudit(\"Limpou lançamentos\", `${unit.name} · ${MESES[s.month]}/${s.year} · ${cleared.length} lançamento(s)`);\n    });\n  }\n  // Chaves em edição REAL (digitadas nos últimos 8s). Entradas antigas são\n  // descartadas: sem isso, um campo que perdeu o foco sem disparar onBlur\n  // (troca de mês, de aba, unmount) travava a sincronização para sempre.\n  activeEditKeys(){\n    if(!this._editBuffer) return [];\n    const now = Date.now();\n    const ts = this._editBufferTs || (this._editBufferTs = {});\n    const ativos = [];\n    Object.keys(this._editBuffer).forEach(k=>{\n      if(now - (ts[k]||0) < 8000) ativos.push(k);\n      else { delete this._editBuffer[k]; delete ts[k]; }\n    });\n    return ativos; onth);\n      const patrimonioLiquido = capitalSocial + lucrosAcumulados;\n      const totalPassivoPL = totalPassivo + patrimonioLiquido;\n      balCaixa = formatBRL(totalPassivoPL);\n      balTotalAtivo = formatBRL(totalPassivoPL);\n      balTotalPassivo = formatBRL(totalPassivo);\n      balCapitalSocial = formatMoeda(capitalSocial);\n      balLucrosAcumulados = formatBRL(lucrosAcumulados);\n      balLucrosColor = lucrosAcumulados>=0 ? \"#16A34A\" : \"#DC2626\";\n      balTotalPL = formatBRL(patrimonioLiquido);\n      balTotalPassivoPL = formatBRL(totalPassivoPL);\n    }\n\n    const isPassivoTab = s.view===\"passivo\";\n    const debtRows = s.debts.map(d=>({\n      id:d.id, credor:d.credor,\n      valorInicial:formatBRL(d.valorInicial),\n      inicio:`${MESES[d.mesInicial]}/${d.anoInicial}`,\n      juros:d.jurosMensal.toLocaleString(\"pt-BR\",{minimumFractionDigits:2,maximumFractionDigits:2})+\"%\",\n      jurosPagar:formatBRL(debtMonthlyInterest(d, s.year, s.month)),\n      acumulado:formatBRL(computeDebtAccumulated(d, s.year, s.month)),\n      onRemove:()=>this.removeDebt(d.id),\n    }));\n    const totalInicial = s.debts.reduce((sum,d)=>sum+d.valorInicial,0);\n    const totalJurosMes = s.debts.reduce((sum,d)=>sum+debtMonthlyInterest(d,s.year,s.month),0);\n    const totalAtualizado = s.debts.reduce((sum,d)=>sum+computeDebtAccumulated(d,s.year,s.month),0);\n    const auditRows = s.auditLog.slice(0,50).map(a=>({\n      ts:new Date(a.ts).toLocaleString(\"pt-BR\"), user:a.user, action:a.action, detail:a.detail,\n    }));\n\n    return {\n      showLogin, showDashboard,\n      authTabEntrarStyle: s.authMode===\"entrar\" ? segOn : segOff,\n      authTabCriarStyle: s.authMode===\"criar\" ? segOn : segOff,\n      setAuthEntrar:()=>this.setAuthMode(\"entrar\"), setAuthCriar:()=>this.setAuthMode(\"criar\"),\n      authEmail:s.authEmail, authSenha:s.authSenha, authError:s.authError,\n      authSenhaFieldType: s.showAuthSenha ? \"text\" : \"password\",\n      authSenhaToggleLabel: s.showAuthSenha ? \"Ocultar\" : \"Mostrar\",\n      toggleAuthSenhaVisible:()=>this.setState({showAuthSenha:!s.showAuthSenha}),\n      onAuthEmailChange:(e)=>this.setState({authEmail:e.target.value}),\n      onAuthSenhaChange:(e)=>this.setState({authSenha:e.target.value}),\n      onAuthSubmit:()=>this.submitAuth(),\n      authSubmitLabel: s.authMode===\"entrar\" ? \"Entrar\" : \"Criar conta\",\n\n      sessionEmail: s.session ? s.session.email : \"\",\n      isAdmin: !!(s.session && s.session.role===\"admin\"),\n      viewTabOperacaoStyle: isOperacao ? segOn : segOff,\n      viewTabConsolidacaoStyle: isConsolidacao ? segOn : segOff,\n      viewTabBalancoStyle: isBalanco ? segOn : segOff,\n      viewTabPassivoStyle: isPassivoTab ? segOn : segOff,\n      setViewOperacao:()=>this.setState({view:\"operacao\"}),\n      setViewConsolidacao:()=>this.setState({view:\"consolidacao\"}),\n      setViewBalanco:()=>this.setState({view:\"balanco\"}),\n      setViewPassivo:()=>this.setState({view:\"passivo\"}),\n      isPassivoTab, debtRows, auditRows, isReadOnly,\n      newCredorLabel: s.newCredorLabel, onNewCredorLabel:(e)=>this.setState({newCredorLabel:e.target.value}), onAddCredor:()=>this.addCredor(),\n      totalInicial:formatBRL(totalInicial), totalJurosMes:formatBRL(totalJurosMes), totalAtualizado:formatBRL(totalAtualizado),\n      newDebtCredor: s.newDebtCredor, onNewDebtCredor:(e)=>this.setState({newDebtCredor:e.target.value}),\n      newDebtValor: formatMoeda(s.newDebtValorRaw), onNewDebtValor:(e)=>this.setState({newDebtValorRaw:parseMoedaInput(e.target.value)}),\n      newDebtMes: s.newDebtMes, onNewDebtMes:(e)=>this.setState({newDebtMes:parseInt(e.target.value,10)}),\n      newDebtAno: s.newDebtAno, onNewDebtAno:(e)=>this.setState({newDebtAno:parseInt(e.target.value,10)}),\n      newDebtJuros: s.newDebtJuros, onNewDebtJuros:(e)=>this.setState({newDebtJuros:parseFloat(e.target.value)||0}),\n      onAddDebt:()=>this.addDebt(),\n      onLogout:()=>this.logout(),\n      openAdmin:()=>{ this.setState({adminOpen:true, adminMsg:\"\"}); this.refreshAdminData(); },\n      closeAdmin:()=>this.setState({adminOpen:false}),\n\n      isOperacao, isConsolidacao, isBalanco, showOperSelector, activeUnitName,\n      opDotColor, tipoBadgeLabel, tipoBadgeBg, tipoBadgeColor,\n      confirmClear: s.confirmClear,\n      clearConfirmLabel: `Limpar todos os lançamentos de ${MESES[s.month]}/${s.year} em ${activeUnitName}?`,\n      onAskClear: ()=>this.setState({confirmClear:true}),\n      onCancelClear: ()=>this.setState({confirmClear:false}),\n      onConfirmClear: ()=>this.clearLancamentos(),\n      balCaixa, balTotalAtivo, balPassivoRows, balTotalPassivo,\n      balCapitalSocial, onCapitalChange:(e)=>this.updateCapital(s.opIndex,e.target.value),\n      balLucrosAcumulados, balLucrosColor, balTotalPL, balTotalPassivoPL,\n      opIndex: s.opIndex,\n      operationOptions: s.units.map((u,i)=>({value:i, label:u.name})),\n      onOpChange:(e)=>{this.flushCommits(); this.setState({opIndex:parseInt(e.target.value,10)});},\n      month: s.month,\n      monthOptions: MESES.map((m,i)=>({value:i, label:m})),\n      onMonthChange:(e)=>{this.flushCommits(); this.setState({month:parseInt(e.target.value,10)});},\n      year: s.year,\n      yearOptions: YEARS,\n      onYearChange:(e)=>{this.flushCommits(); this.setState({year:parseInt(e.target.value,10)});},\n      monthYearLabel: `${MESES[s.month]} / ${s.year}`,\n\n      kpis, resumoRows, categories, contentCols,\n      opSummaryRows, detailCategories,\n      detailUnitHeaders: s.units.map(u=>({name:u.name, dot:u.cor})),\n\n      adminOpen: s.adminOpen,\n      adminUsers: s.users.map(u=>({...u, onRoleChange:(e)=>this.changeUserRole(u,e.target.value)})),\n      adminMsg: s.adminMsg,\n      newUserEmail:s.newUserEmail, newUserSenha:s.newUserSenha, newUserRole:s.newUserRole,\n      onNewUserEmail:(e)=>this.setState({newUserEmail:e.target.value}),\n      onNewUserSenha:(e)=>this.setState({newUserSenha:e.target.value}),\n      onNewUserRole:(e)=>this.setState({newUserRole:e.target.value}),\n      onCreateUser:()=>this.createUser(),\n      changeUserEmail:s.changeUserEmail, changeUserSenha:s.changeUserSenha,\n      onChangeUserEmail:(e)=>this.setState({changeUserEmail:e.target.value}),\n      onChangeUserSenha:(e)=>this.setState({changeUserSenha:e.target.value}),\n      onChangePassword:()=>this.changePassword(),\n      exportCSV:()=>this.exportCSV(), exportExcel:()=>this.exportExcel(), exportPDF:()=>this.exportPDF(),\n      exportMonth: s.exportMonth, exportYear: s.exportYear, exportScope: s.exportScope, exportLoja: s.exportLoja,\n      onExportMonthChange:(e)=>this.setState({exportMonth:parseInt(e.target.value,10)}),\n      onExportYearChange:(e)=>this.setState({exportYear:parseInt(e.target.value,10)}),\n      onExportScopeConsolidado:()=>this.setState({exportScope:\"consolidado\"}),\n      onExportScopeLoja:()=>this.setState({exportScope:\"loja\"}),\n      exportScopeIsLoja: s.exportScope===\"loja\",\n      exportScopeIsConsolidado: s.exportScope===\"consolidado\",\n      onExportLojaChange:(e)=>this.setState({exportLoja:e.target.value}),\n      exportLojaOptions: [{value:\"todas\",label:\"Todas as lojas\"}, ...s.units.map((u,i)=>({value:String(i),label:u.name}))],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
